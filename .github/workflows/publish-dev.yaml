name: Publish DEV image

on:
  push:
    branches: [develop]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: publish-dev
  cancel-in-progress: false

env:
  DOCKER_TAGS: dfxswiss/opencryptopay-api:beta

jobs:
  publish:
    name: Build and push beta
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Require develop
        if: github.ref != 'refs/heads/develop'
        run: |
          echo "::error::This workflow only publishes develop as beta"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ env.DOCKER_TAGS }}
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/openCryptoPay/api
          cache-from: type=gha
          cache-to: type=gha,mode=max
