name: Publish DEV image

on:
  push:
    branches: [develop]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  id-token: write

concurrency:
  group: publish-dev
  cancel-in-progress: false

env:
  DOCKER_TAGS: dfxswiss/opencryptopay-api:beta

jobs:
  publish:
    name: Build and push beta
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Require develop
        if: github.ref != 'refs/heads/develop'
        run: |
          echo "::error::This workflow only publishes develop as beta"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ env.DOCKER_TAGS }}
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/openCryptoPay/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify image publish endpoint
        if: github.event_name == 'push'
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          digest_re='^sha256:[0-9a-f]{64}$'
          if [[ ! "${IMAGE_DIGEST}" =~ ${digest_re} ]]; then
            echo "::error::image digest is missing or malformed"
            exit 1
          fi
          audience='https://image-published.dfxserve.com/v1/image-published'
          oidc_token="$(curl --silent --fail \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${audience}" \
            | jq -er '.value' 2>/dev/null)" || {
            echo "::error::failed to request identity token"
            exit 1
          }
          if [ -z "${oidc_token}" ]; then
            echo "::error::failed to request identity token"
            exit 1
          fi
          body="$(jq -nc --arg digest "${IMAGE_DIGEST}" '{image:"dfxswiss/opencryptopay-api",tag:"beta",digest:$digest}')"
          http_code="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${oidc_token}" \
            -H "Content-Type: application/json" \
            --data "${body}" \
            "${audience}")" || {
            echo "::error::image publish request failed"
            exit 1
          }
          case "${http_code}" in
            2[0-9][0-9]) ;;
            *)
              echo "::error::image publish request failed"
              exit 1
              ;;
          esac
